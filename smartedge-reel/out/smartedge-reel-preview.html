.stage {
  --paper: #15110D; --ink: #F5F1ED; --orange: #FF5A36; --green: #145C4B;
  --surface: #1F1B15; --success: #B7E6B7; --alert: #FEC3BD;
  --ink-a: color-mix(in srgb, var(--ink) 55%, transparent);
  --ink-b: color-mix(in srgb, var(--ink) 38%, transparent);
  --hair: color-mix(in srgb, var(--ink) 10%, transparent);
  /* Glass: brand surface, translucent, frosted, lit from the top edge */
  --glass-fill: linear-gradient(180deg, color-mix(in srgb, var(--surface) 62%, transparent), color-mix(in srgb, var(--paper) 58%, transparent));
  --glass-sheen: linear-gradient(160deg, color-mix(in srgb, var(--ink) 9%, transparent) 0%, color-mix(in srgb, var(--ink) 2%, transparent) 38%, transparent 60%);
  --glass-edge: color-mix(in srgb, var(--ink) 14%, transparent);
  --glass-blur: blur(34px) saturate(150%);
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision; font-kerning: normal;
}
.stage *, .stage *::before, .stage *::after { box-sizing: border-box; }
.display { font-family: var(--f-display); font-variation-settings: 'opsz' 96; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.world, .layer, .phone-stage { position: absolute; inset: 0; }
.world { transform-origin: 50% 50%; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: currentColor; flex: none; }

.w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.02em 0.1em; margin: -0.06em -0.02em -0.1em; }
.wi { display: inline-block; will-change: transform; }
.accent { color: var(--orange); }

/* ---------- background ---------- */
.bg { position: absolute; inset: 0; background: var(--paper); --alert-mix: 0;
  --lc: color-mix(in oklab, var(--alert) calc(var(--alert-mix) * 60%), var(--orange)); }
.bg-light { position: absolute; left: 0; top: 0; width: 1400px; height: 1400px; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--lc) 26%, transparent) 0%, color-mix(in srgb, var(--lc) 9%, transparent) 32%, transparent 64%); }
.bg-light-2 { background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--green) 55%, transparent) 0%, transparent 60%); }
.bg-vignette { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 45%, transparent 45%, rgba(0,0,0,.6) 100%); }
.grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: .045; mix-blend-mode: overlay; pointer-events: none; }

/* ---------- phone ---------- */
.phone-stage { perspective: 2600px; }
.phone { position: absolute; left: 0; top: 0; width: 600px; height: 1236px; transform-origin: 50% 50%; }
.phone-shadow { position: absolute; left: 50px; right: 50px; bottom: -70px; height: 140px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0,0,0,.75), transparent); filter: blur(10px); }
.phone-frame { position: absolute; inset: 0; border-radius: 98px;
  background: linear-gradient(150deg, #4a4038 0%, #1c1713 22%, #0c0a08 55%, #2a231d 85%, #564a40 100%);
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14), inset 0 0 0 8px #070605, 0 50px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.6); }
.phone-screen { position: absolute; inset: 14px; border-radius: 84px; overflow: hidden;
  background: radial-gradient(140% 70% at 50% -5%, #2b221a 0%, #120e0b 58%, #0d0a08 100%); }
.phone-glare { position: absolute; inset: 14px; border-radius: 84px; pointer-events: none; mix-blend-mode: screen;
  background: linear-gradient(118deg, transparent 32%, rgba(255,255,255,.09) 44%, rgba(255,255,255,.02) 52%, transparent 62%);
  background-size: 260% 260%; }
.screen-tint { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(90% 55% at 50% 42%, color-mix(in srgb, var(--alert) 16%, transparent), transparent 70%); }
.status { position: absolute; top: 34px; left: 64px; right: 52px; display: flex; justify-content: space-between; align-items: center;
  font: 600 26px/1 var(--f-body); color: var(--ink); z-index: 3; }
.sys { display: flex; gap: 12px; align-items: center; }
.sig { display: flex; gap: 3px; align-items: flex-end; height: 20px; }
.sig b { width: 5px; background: var(--ink); border-radius: 1px; }
.sig b:nth-child(1) { height: 6px; } .sig b:nth-child(2) { height: 10px; } .sig b:nth-child(3) { height: 14px; } .sig b:nth-child(4) { height: 19px; }
.bat { width: 42px; height: 20px; border: 2px solid var(--ink-a); border-radius: 6px; padding: 2px; position: relative; }
.bat b { display: block; height: 100%; width: 72%; background: var(--ink); border-radius: 2px; }
.island { position: absolute; top: 22px; left: 50%; width: 190px; height: 56px; margin-left: -95px; background: #000; border-radius: 30px; z-index: 4; }

.v-incoming, .v-missed, .v-connected { position: absolute; inset: 0; transform-origin: 50% 45%; }
.inc-head { position: absolute; top: 175px; left: 0; right: 0; text-align: center; }
.inc-line { font: 500 20px/1 var(--f-mono); letter-spacing: .18em; color: var(--ink-b); }
.inc-name { font: 600 58px/1.1 var(--f-body); margin-top: 22px; letter-spacing: -0.01em; }
.inc-sub { font: 500 26px/1.2 var(--f-body); margin-top: 12px; color: var(--ink-a); }
.avatar-wrap { position: absolute; top: 470px; left: 50%; width: 224px; height: 224px; margin-left: -112px; }
.ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--orange) 70%, transparent); }
.avatar { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; color: var(--ink-b);
  background: linear-gradient(160deg, #3a3129, #1d1813); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 20px 40px rgba(0,0,0,.4); }
.avatar .ico { width: 120px; height: 120px; }
.call-btns { position: absolute; bottom: 118px; left: 78px; right: 78px; display: flex; justify-content: space-between; }
.cbtn { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.cb { width: 136px; height: 136px; border-radius: 50%; display: grid; place-items: center; }
.cb .ico { width: 62px; height: 62px; }
.decline .cb { background: var(--alert); color: var(--paper); }
.accept .cb { background: var(--green); color: var(--success); box-shadow: 0 0 0 1px color-mix(in srgb, var(--success) 25%, transparent), 0 16px 40px color-mix(in srgb, var(--green) 70%, transparent); }
.cl { font: 500 24px/1 var(--f-body); color: var(--ink-a); }
.ai-sheet { position: absolute; left: 22px; right: 22px; bottom: 24px; height: 380px; border-radius: 64px;
  background: linear-gradient(180deg, rgba(40,33,26,.97), rgba(24,20,16,.97)); border: 1px solid var(--hair);
  box-shadow: 0 -20px 60px rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; padding-top: 36px; gap: 18px; }
.sheet-mark { width: 124px; height: auto; }
.sheet-txt { text-align: center; }
.sheet-title { font: 700 38px/1.1 var(--f-display); letter-spacing: .01em; }
.sheet-ans { font: 500 26px/1 var(--f-mono); color: var(--orange); margin-top: 12px; letter-spacing: .06em; }
.sheet-bar { width: 58%; height: 4px; border-radius: 2px; background: var(--hair); overflow: hidden; }
.sheet-bar b { display: block; height: 100%; background: var(--orange); transform-origin: 0 50%; }

.v-missed { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 80px; text-align: center; }
.mis-icon { width: 176px; height: 176px; border-radius: 50%; display: grid; place-items: center; color: var(--alert);
  background: color-mix(in srgb, var(--alert) 12%, transparent); border: 2px solid color-mix(in srgb, var(--alert) 45%, transparent); }
.mis-icon .ico { width: 84px; height: 84px; }
.mis-title { font: 700 56px/1.1 var(--f-body); color: var(--alert); margin-top: 44px; }
.mis-name { font: 600 34px/1.2 var(--f-body); color: color-mix(in srgb, var(--ink) 75%, transparent); margin-top: 16px; }
.mis-sub { font: 500 22px/1 var(--f-mono); color: var(--ink-b); margin-top: 18px; letter-spacing: .06em; }

.con-head { position: absolute; top: 140px; left: 0; right: 0; text-align: center; }
.con-live { display: inline-flex; align-items: center; gap: 12px; font: 500 22px/1 var(--f-mono); letter-spacing: .12em; }
.con-live .dot { color: var(--success); } .con-live .lbl { color: var(--success); } .con-live .tmr { color: var(--ink-a); }
.con-name { font: 600 46px/1.1 var(--f-body); margin-top: 20px; }
.con-by { display: inline-flex; align-items: center; gap: 10px; font: 500 23px/1 var(--f-body); color: var(--ink-a); margin-top: 14px; }
.con-by img { width: 32px; height: auto; }
.wave { position: absolute; top: 385px; left: 64px; right: 64px; height: 84px; display: flex; gap: 6px; align-items: center; }
.wave i { flex: 1; height: 100%; border-radius: 4px; background: var(--orange); transform-origin: 50% 50%; opacity: .9; }
.chat { position: absolute; top: 520px; left: 34px; right: 34px; display: flex; flex-direction: column; gap: 24px; }
.bubble { display: grid; max-width: 90%; padding: 22px 28px 24px; border-radius: 36px; }
.bubble.guest { align-self: flex-start; background: #2b241d; border-bottom-left-radius: 10px; }
.bubble.ai { align-self: flex-end; background: color-mix(in srgb, var(--orange) 13%, #1a1511); border: 1px solid color-mix(in srgb, var(--orange) 38%, transparent); border-bottom-right-radius: 10px; }
.b-label { grid-area: 1 / 1; display: flex; align-items: center; gap: 8px; font: 500 18px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-b); margin-bottom: 12px; }
.bubble.ai .b-label { color: var(--orange); }
.b-label img { width: 24px; height: auto; }
.b-text { grid-area: 2 / 1; font: 500 32px/1.3 var(--f-body); color: var(--ink); }
.b-text.ghost { visibility: hidden; }
.typing { grid-area: 2 / 1; display: flex; gap: 9px; align-items: center; height: 42px; }

/* ---- engine/core.js ---- */
/*  Deterministic motion engine.
    Every frame is a pure function of the master time T (seconds):
    SE.render(T) sets every animated property from scratch, so any frame
    can be rendered in any order — which is what the video renderer does.
*/
(function () {
  const SE = (window.SE = window.SE || {});

  // ---------- math ----------
  SE.clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  SE.lerp = (a, b, t) => a + (b - a) * t;
  SE.ease = {
    linear: (t) => t,
    inQuad: (t) => t * t,
    inCubic: (t) => t * t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    outQuart: (t) => 1 - Math.pow(1 - t, 4),
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    inOutQuart: (t) => (t < 0.5 ? 8 * t ** 4 : 1 - Math.pow(-2 * t + 2, 4) / 2),
    inOutExpo: (t) =>
      t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
    outBack: (t) => {
      const c1 = 1.1, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
  };
  /** progress of t through [a,b], eased, clamped 0..1 */
  SE.p = (t, a, b, e = SE.ease.linear) => e(SE.clamp((t - a) / (b - a)));
  /** 0→1 over [a, a+fi], 1→0 over [b-fo, b] */
  SE.win = (t, a, b, fi = 0.3, fo = 0.3, e = SE.ease.inOutCubic) =>
    Math.min(SE.p(t, a, a + fi, e), 1 - SE.p(t, b - fo, b, e));

  /** seeded PRNG (mulberry32) — deterministic particles/grain */
  SE.rng = (seed) => () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  // ---------- DOM ----------
  SE.el = (tag, cls, parent, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  };

  const cache = new WeakMap();
  /** style setter that only touches the DOM when a value changes */
  SE.css = (el, props) => {
    let c = cache.get(el);
    if (!c) cache.set(el, (c = {}));
    for (const k in props) {
      const v = props[k];
      if (c[k] === v) continue;
      c[k] = v;
      if (k[0] === '-') el.style.setProperty(k, v);
      else el.style[k] = v;
    }
  };
  SE.text = (el, s) => {
    let c = cache.get(el);
    if (!c) cache.set(el, (c = {}));
    if (c.__text !== s) { c.__text = s; el.textContent = s; }
  };

  /** Transform/opacity/filter shorthand.
      {o, x, y, z, s, sx, sy, rx, ry, rz, blur, bright, sat} */
  SE.set = (el, o) => {
    const tf = [];
    if (o.x || o.y || o.z) tf.push(`translate3d(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px,${(o.z || 0).toFixed(2)}px)`);
    if (o.rx) tf.push(`rotateX(${o.rx.toFixed(3)}deg)`);
    if (o.ry) tf.push(`rotateY(${o.ry.toFixed(3)}deg)`);
    if (o.rz) tf.push(`rotateZ(${o.rz.toFixed(3)}deg)`);
    if (o.s != null && o.s !== 1) tf.push(`scale(${o.s.toFixed(4)})`);
    if (o.sx != null || o.sy != null) tf.push(`scale(${(o.sx ?? 1).toFixed(4)},${(o.sy ?? 1).toFixed(4)})`);
    const f = [];
    if (o.blur > 0.05) f.push(`blur(${o.blur.toFixed(2)}px)`);
    if (o.bright != null && Math.abs(o.bright - 1) > 0.005) f.push(`brightness(${o.bright.toFixed(3)})`);
    if (o.sat != null && Math.abs(o.sat - 1) > 0.005) f.push(`saturate(${o.sat.toFixed(3)})`);
    const op = o.o == null ? 1 : SE.clamp(o.o);
    SE.css(el, {
      transform: tf.join(' ') || 'none',
      filter: f.join(' ') || 'none',
      opacity: op.toFixed(3),
      visibility: op < 0.002 ? 'hidden' : 'visible',
    });
  };

  /** Split text into masked words for line/word reveals. */
  SE.words = (parent, text, accent = []) =>
    text.split(' ').map((w) => {
      const outer = SE.el('span', 'w', parent);
      const inner = SE.el('span', 'wi' + (accent.includes(w) ? ' accent' : ''), outer, w);
      parent.appendChild(document.createTextNode(' '));
      return inner;
    });
  /** Reveal words upward from their mask. */
  SE.revealWords = (spans, t, start, stagger = 0.05, dur = 0.55, dir = 1) => {
    spans.forEach((sp, i) => {
      const k = SE.p(t, start + i * stagger, start + i * stagger + dur, SE.ease.outExpo);
      SE.set(sp, { y: (1 - k) * 110 * dir, o: k > 0 ? 1 : 0 });
    });
  };
  /** Typewriter: returns substring of text for progress k. */
  SE.typed = (text, k) => text.slice(0, Math.round(SE.clamp(k) * text.length));

  SE.fmtTime = (s) => {
    const m = Math.floor(s / 60), r = s - m * 60;
    return `${String(m).padStart(2, '0')}:${r.toFixed(2).padStart(5, '0')}`;
  };

  // ---------- timeline ----------
  SE.scenes = [];
  SE.scene = (def) => SE.scenes.push(def);

  /** Story clock: identical to T, except it runs backwards during the rewind. */
  SE.story = (T) => {
    const r = SE.config.rewind;
    if (T < r.start) return T;
    if (T < r.end) return SE.lerp(r.from, r.to, SE.ease.inOutCubic((T - r.start) / (r.end - r.start)));
    return r.to;
  };

  SE.init = async (stage) => {
    const cfg = SE.config;
    for (const [k, v] of Object.entries(cfg.colors)) stage.style.setProperty('--' + k, v);
    stage.style.setProperty('--f-display', cfg.fonts.display);
    stage.style.setProperty('--f-body', cfg.fonts.body);
    stage.style.setProperty('--f-mono', cfg.fonts.mono);

    const ctx = (SE.ctx = { stage, cfg, T: 0, S: 0 });
    ctx.world = SE.el('div', 'world', stage);
    ctx.bg = SE.Background(ctx.world, ctx);
    ctx.phone = SE.Phone(ctx.world, ctx);
    for (const s of SE.scenes) {
      s.layer = SE.el('div', 'layer layer-' + s.id, ctx.world);
      s.build(s.layer, ctx);
    }
    ctx.grain = SE.Grain(stage);

    // Wait for fonts and images so frame 0 is final.
    const fonts = ['700 40px "Bricolage Grotesque"', '500 40px "Manrope"', '500 40px "JetBrains Mono"'];
    await Promise.all(fonts.map((f) => document.fonts.load(f)));
    await document.fonts.ready;
    await Promise.all([...stage.querySelectorAll('img')].map((i) => (i.decode ? i.decode().catch(() => {}) : null)));
    SE.render(0);
    return ctx;
  };

  SE.render = (T) => {
    const ctx = SE.ctx;
    ctx.T = T;
    ctx.S = SE.story(T);
    ctx.world_ = { s: 1, x: 0, y: 0, blur: 0, bright: 1, sat: 1, rz: 0 };
    ctx.bg.reset();
    ctx.phone.reset();
    for (const s of SE.scenes) s.update(ctx);
    ctx.phone.apply();
    ctx.bg.apply();
    SE.set(ctx.world, ctx.world_);
  };
})();

    const sheetAns = SE.el('div', 'sheet-ans', sheetTxt, `Answering<span class="dots"><i>.</i><i>.</i><i>.</i></span>`);
    const sheetDots = [...sheetAns.querySelectorAll('.dots i')];
    const sheetBar = SE.el('div', 'sheet-bar', sheet, '<b></b>');
    const sheetBarFill = sheetBar.firstChild;

    // Missed view
    const mis = SE.el('div', 'v-missed', screen);
    const misIcon = SE.el('div', 'mis-icon', mis, SE.svgIcon('missed'));
    SE.el('div', 'mis-title', mis, c.missedTitle);
    SE.el('div', 'mis-name', mis, c.caller);
    SE.el('div', 'mis-sub', mis, c.missedSub);

    // Connected (AI) view
    const con = SE.el('div', 'v-connected', screen);
    const conHead = SE.el('div', 'con-head', con);
    const conLive = SE.el('div', 'con-live', conHead, `<i class="dot"></i><span class="lbl">${ai.liveLabel}</span><span class="tmr">00:01</span>`);
    const conTimer = conLive.querySelector('.tmr');
    SE.el('div', 'con-name', conHead, c.caller);
    const conBy = SE.el('div', 'con-by', conHead);
    const conByMark = SE.el('img', '', conBy); conByMark.src = ctx.cfg.assets.mark;
    SE.el('span', '', conBy, ai.handledBy);
    const wave = SE.el('div', 'wave', con);
    const bars = Array.from({ length: 36 }, () => SE.el('i', '', wave));
    const chat = SE.el('div', 'chat', con);
    const b1 = SE.el('div', 'bubble guest', chat);
    SE.el('div', 'b-label', b1, ai.guestLabel);
    const b1t = SE.el('div', 'b-text', b1);
    const b1ghost = SE.el('div', 'b-text ghost', b1, ai.guest);
    const b2 = SE.el('div', 'bubble ai', chat);
    const b2l = SE.el('div', 'b-label', b2);
    const b2m = SE.el('img', '', b2l); b2m.src = ctx.cfg.assets.mark;
    SE.el('span', '', b2l, ai.aiLabel);
    const b2t = SE.el('div', 'b-text', b2);
    SE.el('div', 'b-text ghost', b2, ai.reply);
    const typing = SE.el('div', 'typing', b2, '<i></i><i></i><i></i>');
    const typingDots = [...typing.children];
    const endBtn = SE.el('div', 'con-end', con, SE.svgIcon('callEnd'));

    const glare = SE.el('div', 'phone-glare', phone);

    const api = {
      s: null,
      reset() {
        api.s = {
          o: 0, x: 540, y: 1040, s: 0.8, rx: 0, ry: 0, rz: 0, blur: 0, dim: 0,
          ring: 0, buzz: 0, missed: 0, ai: 0, answer: 0, connected: 0,
          chat1: 0, chat2: 0, typing: 0, speak: 0, callSecs: 1, glare: 0.3,
        };
      },
      apply() {
        const s = api.s, T = ctx.T, t = ctx.S;
        // Vibration buzz: short bursts, fully deterministic.
        const burst = s.buzz * (Math.sin(t * Math.PI * 2 * 1.6) > 0.1 ? 1 : 0);
        const jx = burst * Math.sin(t * 190) * 2.4;
        const jr = burst * Math.sin(t * 150) * 0.35;
        SE.set(phone, {
          x: s.x - W / 2 + jx, y: s.y - H / 2, s: s.s,
          rx: s.rx, ry: s.ry, rz: s.rz + jr, o: s.o, blur: s.blur,
          bright: 1 - s.dim * 0.55, sat: 1 - s.dim * 0.4,
        });
        SE.css(glare, { opacity: s.glare.toFixed(3), backgroundPosition: `${(40 + s.ry * 3).toFixed(1)}% ${(30 - s.rx * 3).toFixed(1)}%` });
        SE.css(shadow, { opacity: (0.9 * (1 - s.blur / 20)).toFixed(3) });

        // Incoming
        const incO = (1 - s.missed) * (1 - s.connected);
        SE.set(inc, { o: incO, s: 1 - s.missed * 0.06, blur: s.missed * 10 + s.connected * 6 });
        rings.forEach((r, i) => {
          const ph = ((t * 1.25 + i / 3) % 1 + 1) % 1;
          SE.set(r, { s: 1 + ph * 1.1, o: s.ring * (1 - ph) * 0.55 });
        });
        SE.set(avatar, { s: 1 + s.ring * 0.03 * Math.sin(t * 12) });
        SE.set(accCircle, { s: 1 + s.ring * (1 - s.ai) * 0.06 * (0.5 + 0.5 * Math.sin(t * 9)) - s.answer * 0.12 });
        SE.set(decl, { o: 1 - s.ai });
        SE.set(acc, { o: 1 - s.ai * 0.0, x: -s.ai * 0 });
        SE.set(btns, { o: 1 - s.ai, y: s.ai * 40 });
        SE.set(sheet, { y: (1 - s.ai) * 520, o: s.ai > 0 ? 1 : 0 });
        SE.set(sheetMark, { rz: t * 40, s: 1 + 0.04 * Math.sin(T * 6) });
        sheetDots.forEach((d, i) => SE.css(d, { opacity: (0.25 + 0.75 * (Math.sin(T * 8 - i * 0.9) > 0 ? 1 : 0)).toFixed(2) }));
        SE.css(sheetBarFill, { transform: `scaleX(${SE.clamp(s.answer).toFixed(3)})` });

        // Missed
        SE.set(mis, { o: s.missed, s: 1.06 - s.missed * 0.06, blur: (1 - s.missed) * 8 });
        SE.set(misIcon, { s: 0.7 + 0.3 * SE.ease.outBack(SE.clamp(s.missed)) });
        SE.css(screenTint, { opacity: (s.missed * 0.7).toFixed(3) });

        // Connected
        SE.set(con, { o: s.connected, s: 1.04 - 0.04 * s.connected, blur: (1 - s.connected) * 8 });
        SE.text(conTimer, '00:' + String(Math.max(1, Math.floor(s.callSecs))).padStart(2, '0'));
        const liveDot = conLive.firstChild;
        SE.css(liveDot, { opacity: (0.5 + 0.5 * Math.sin(T * 7)).toFixed(2) });
        bars.forEach((b, i) => {
          const a = Math.abs(Math.sin(i * 1.7 + T * 9) * Math.sin(i * 0.37 + T * 5.3));
          const env = Math.sin((i / (bars.length - 1)) * Math.PI);
          const h = 0.08 + s.speak * env * (0.2 + 0.8 * a);
          SE.css(b, { transform: `scaleY(${h.toFixed(3)})` });
        });
        const k1 = SE.clamp(s.chat1);
        SE.set(b1, { o: SE.clamp(k1 * 6), y: (1 - SE.ease.outCubic(SE.clamp(k1 * 3))) * 30 });
        SE.text(b1t, SE.typed(ai.guest, SE.clamp((k1 - 0.05) / 0.95)));
        const k2 = SE.clamp(s.chat2);
        const ty = SE.clamp(s.typing);
        SE.set(b2, { o: Math.max(SE.clamp(ty * 6), SE.clamp(k2 * 6)), y: (1 - SE.ease.outCubic(SE.clamp(Math.max(ty, k2) * 3))) * 30 });
        SE.text(b2t, SE.typed(ai.reply, k2));
        SE.set(typing, { o: ty > 0 && k2 <= 0 ? 1 : 0 });
        typingDots.forEach((d, i) => SE.set(d, { y: -6 * Math.max(0, Math.sin(T * 10 - i * 0.8)) }));
        SE.set(endBtn, { o: s.connected });
      },
    };
    api.reset();
    return api;
  };
})();

/* ---- scenes/01-hook.js ---- */
/*  SCENE 1 — THE HOOK (0–2.6s)
    Phone rings, headline lands, call goes unanswered → MISSED CALL.
    Runs on the story clock (ctx.S) so Scene 3 can rewind it. */
SE.scene({
  id: 'hook',
  build(layer, ctx) {
    const c = ctx.cfg.copy.hook;
    this.head = SE.el('div', 'hook-head display', layer);
    this.lines = c.headline.map((line) => {
      const l = SE.el('div', 'line', this.head);
      return SE.words(l, line, c.accentWords);
    });
    this.words = this.lines.flat();

    this.slam = SE.el('div', 'hook-slam', layer);
    this.slamRule = SE.el('div', 'slam-rule', this.slam);
    this.slamText = SE.el('div', 'slam-text display', this.slam);
    this.slamChars = [...c.missed].map((ch) => SE.el('span', '', this.slamText, ch === ' ' ? '&nbsp;' : ch));
    this.slamMeta = SE.el('div', 'slam-meta mono', this.slam, c.missedMeta);
  },
  update(ctx) {
    const E = SE.ease, p = SE.p;
    const [a] = ctx.cfg.scenes.hook;
    const t = ctx.S - a;
    const T = ctx.T;
    const freezeEnd = ctx.cfg.rewind.freezeUntil;
    // After the rewind freeze, Scene 3 takes the stage: fade our text out.
    const handoff = 1 - p(T, freezeEnd, freezeEnd + 0.18, E.inOutCubic);
    const inScene = t < 3.2 ? 1 : 0;

    // Headline: words rise out of their masks immediately.
    SE.revealWords(this.words, t, 0.02, 0.045, 0.6);
    const headOut = p(t, 1.38, 1.62, E.inOutCubic);
    SE.set(this.head, { o: (1 - headOut) * handoff * inScene, y: -headOut * 60 - p(t, 0, 2, E.outCubic) * 10 - (1 - handoff) * 50, blur: headOut * 10 + (1 - handoff) * 8 });

    // Phone
    const ph = ctx.phone.s;
    if (t < 3.2) {
      const intro = p(t, -0.1, 1.6, E.outCubic);
      const push = p(t, 2.0, 2.6, E.inOutQuart);
      ph.o = 1 - p(t, 2.2, 2.55, E.inOutCubic);
      ph.x = 540;
      ph.y = SE.lerp(1085, 1060, intro) - push * 60;
      ph.s = SE.lerp(0.76, 0.8, intro) + push * 1.6;
      ph.ry = SE.lerp(-16, -5, intro) * (1 - push);
      ph.rx = SE.lerp(8, 3, intro) * (1 - push);
      ph.rz = SE.lerp(-2, 0, intro);
      ph.blur = push * 14;
      ph.ring = t < 1.42 ? 1 : 0;
      ph.buzz = t < 1.42 ? 1 : 0;
      ph.missed = p(t, 1.45, 1.75, E.outCubic);
      ph.dim = p(t, 1.5, 1.8, E.outCubic) * 0.3 * (1 - push);
      ph.glare = 0.35;
    }

    // MISSED CALL slam — a hard cut, not a glitch: characters drop in fast.
    const slamIn = p(t, 1.5, 1.9, E.outExpo);
    const slamOut = p(t, 2.05, 2.4, E.inOutCubic);
    this.slamChars.forEach((ch, i) => {
      const k = p(t, 1.5 + i * 0.018, 1.5 + i * 0.018 + 0.34, E.outExpo);
      SE.set(ch, { y: (1 - k) * -80, o: k, blur: (1 - k) * 10 });
    });
    SE.css(this.slamRule, { transform: `scaleX(${p(t, 1.48, 1.85, E.outExpo).toFixed(4)})` });
    SE.set(this.slamMeta, { o: p(t, 1.7, 1.95, E.outCubic), y: (1 - p(t, 1.7, 1.95, E.outCubic)) * 14 });
    SE.set(this.slam, { o: (slamIn > 0 ? 1 : 0) * (1 - slamOut) * inScene, s: 1 + slamOut * 0.08, blur: slamOut * 8, y: -slamOut * 30 });

    // Controlled impact: one small decaying camera kick at the miss.
    const kick = t > 1.5 && t < 2.2 ? Math.exp(-(t - 1.5) * 9) * Math.sin((t - 1.5) * 55) : 0;
    ctx.world_.y += kick * 7;
    ctx.world_.s *= 1 + p(t, 0, 2, E.outCubic) * 0.015;

    // Light: warm while ringing, cools toward the alert tint on the miss.
    if (t < 3.2) {
      ctx.bg.s.y = 1000;
      ctx.bg.s.o = 0.55 * (1 - p(t, 1.45, 1.9)) + 0.18;
      ctx.bg.s.alert = p(t, 1.45, 1.9) * (1 - p(t, 2.2, 2.6));
    }
  },
});

/* ---- scenes/02-lost.js ---- */
/*  SCENE 2 — THE LOST BOOKING (2.2–6.0s)
    Revenue visualisation: €247 potential booking drops to €0 LOST,
    with the wider cost listed underneath. Runs on the story clock. */
SE.scene({
  id: 'lost',
  build(layer, ctx) {
    const c = ctx.cfg.copy.lost;
    this.c = c;
    this.eyebrow = SE.el('div', 'lost-eyebrow mono', layer, `<i class="dot"></i>${c.eyebrow}`);
    this.numWrap = SE.el('div', 'lost-num mono', layer);
    this.cur = SE.el('span', 'cur', this.numWrap, c.currency);
    this.num = SE.el('span', 'val', this.numWrap, String(c.value));
    this.labels = SE.el('div', 'lost-labels display', layer);
    this.lblA = SE.el('div', 'lbl', this.labels, c.label);
    this.lblB = SE.el('div', 'lbl lost', this.labels, c.lostLabel);

    // Chart: booking value over the evening, drawn to one scale (€0–€300).
    const W = 888, H = 300;
    this.chart = { W, H, max: 300 };
    const y = (v) => H - (v / 300) * H;
    this.y = y;
    const pts = [[0, 40], [110, 62], [210, 58], [320, 96], [420, 120], [520, 150], [610, 176], [700, 205], [790, 232], [888, 247]];
    this.pts = pts;
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${y(p[1]).toFixed(1)}`).join(' ');
    const grid = [0, 100, 200, 300].map((v) =>
      `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="g"/><text x="0" y="${y(v) - 10}" class="gt">€${v}</text>`).join('');
    const svg = SE.el('div', 'lost-chart', layer, `
      <svg viewBox="-2 -30 ${W + 4} ${H + 34}" width="${W + 4}" height="${H + 34}">
        <defs>
          <linearGradient id="lostFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="var(--orange)" stop-opacity=".28"/>
            <stop offset="1" stop-color="var(--orange)" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="lostClip"><rect id="lostClipRect" x="-2" y="-30" width="0" height="${H + 40}"/></clipPath>
        </defs>
        <g class="grid">${grid}</g>
        <g clip-path="url(#lostClip)">
          <path class="area" d="${d} L${W},${H} L0,${H} Z" fill="url(#lostFill)"/>
          <path class="line" d="${d}" fill="none"/>
        </g>
        <line class="drop" x1="${W}" x2="${W}" y1="${y(247)}" y2="${y(247)}"/>
        <circle class="end-halo" cx="${W}" cy="${y(247)}" r="22"/>
        <circle class="end" cx="${W}" cy="${y(247)}" r="9"/>
      </svg>`);
    this.svg = svg;
    this.clip = svg.querySelector('#lostClipRect');
    this.line = svg.querySelector('.line');
    this.area = svg.querySelector('.area');
    this.drop = svg.querySelector('.drop');
    this.end = svg.querySelector('.end');
    this.halo = svg.querySelector('.end-halo');
    this.grid = svg.querySelector('.grid');

    this.statsWrap = SE.el('div', 'lost-stats', layer);
    this.stats = c.stats.map((s) => {
      const row = SE.el('div', 'stat', this.statsWrap);
      SE.el('span', 'stat-n mono', row, s.n);
      SE.el('span', 'stat-l display', row, s.label);
      return row;
    });
  },
  update(ctx) {
    const E = SE.ease, p = SE.p, c = this.c;
    const [a] = ctx.cfg.scenes.lost;
    const t = ctx.S - a;
    const handoff = 1 - p(ctx.T, ctx.cfg.rewind.end - 0.35, ctx.cfg.rewind.end, E.inOutCubic);

    const enter = p(t, 0.0, 0.7, E.outExpo);
    const vis = enter * handoff;
    SE.set(this.layer, { o: vis > 0 ? 1 : 0 });

    // Eyebrow & big number rise out of the phone push.
    SE.set(this.eyebrow, { o: p(t, 0.15, 0.55, E.outCubic) * handoff, y: (1 - p(t, 0.15, 0.6, E.outCubic)) * 20 });

    // The drop: value counts down with an accelerating ease.
    const drop = p(t, 1.5, 2.05, E.inCubic);
    const settle = p(t, 2.05, 2.5, E.outCubic);
    const v = Math.round(c.value * (1 - drop));
    SE.text(this.num, String(v));
    const speed = drop > 0 && drop < 1 ? 1 : 0;
    SE.set(this.numWrap, {
      o: enter * handoff,
      s: SE.lerp(1.12, 1, enter),
      y: (1 - enter) * 40 + drop * 36 - settle * 36 + speed * 6,
      blur: (1 - enter) * 14 + speed * 2.5,
    });
    SE.css(this.numWrap, { '--mix': drop.toFixed(3) });

    // Labels crossfade: POTENTIAL BOOKING → LOST
    const lblIn = p(t, 0.3, 0.8, E.outExpo);
    SE.set(this.lblA, { o: lblIn * (1 - p(t, 1.6, 1.9)) * handoff, y: (1 - lblIn) * 30 + p(t, 1.6, 1.95, E.inCubic) * 30 });
    const lostIn = p(t, 1.95, 2.35, E.outExpo);
    SE.set(this.lblB, { o: lostIn * handoff, y: (1 - lostIn) * -30 });

    // Chart draws in, then the endpoint falls to €0.
    const draw = p(t, 0.2, 1.3, E.inOutCubic);
    SE.css(this.clip, { width: String((draw * (this.chart.W + 30)).toFixed(1)) });
    SE.css(this.grid, { opacity: (p(t, 0.1, 0.6) * 0.9).toFixed(3) });
    const endY = SE.lerp(this.y(247), this.y(0), drop);
    this.end.setAttribute('cy', endY.toFixed(1));
    this.halo.setAttribute('cy', endY.toFixed(1));
    this.drop.setAttribute('y2', endY.toFixed(1));
    SE.css(this.end, { opacity: p(t, 1.1, 1.3).toFixed(3) });
    SE.css(this.halo, { opacity: (p(t, 1.1, 1.3) * (0.5 + 0.35 * Math.sin(ctx.T * 6)) * (1 - drop)).toFixed(3) });
    SE.css(this.svg, { '--mix': drop.toFixed(3) });
    SE.set(this.svg, { o: p(t, 0.05, 0.5, E.outCubic) * handoff * (1 - p(t, 2.6, 3.2) * 0.45), y: (1 - p(t, 0.05, 0.7, E.outCubic)) * 30 });

    // Supporting losses — one row at a time.
    this.stats.forEach((row, i) => {
      const k = p(t, 2.05 + i * 0.24, 2.05 + i * 0.24 + 0.55, E.outExpo);
      SE.set(row, { o: k * handoff, y: (1 - k) * 36 });
      SE.css(row, { '--rule': k.toFixed(3) });
    });

    // Rewind makes the view feel sucked back into the phone.
    if (t > -0.2 && t < 4) {
      ctx.bg.s.y = SE.lerp(1000, 700, enter);
      ctx.bg.s.o = SE.lerp(ctx.bg.s.o, 0.4 - drop * 0.25, enter);
      ctx.bg.s.alert = Math.max(ctx.bg.s.alert, drop * 0.9 * handoff);
    }
  },
});

/* ---- scenes/03-rewind.js ---- */
/*  SCENE 3 — REWIND (6.0–9.4s)
    Scenes 1–2 play backwards (driven by the story clock in engine/core.js),
    freeze on the ringing phone, then the AI receptionist answers. */
SE.scene({
  id: 'rewind',
  build(layer, ctx) {
    const c = ctx.cfg.copy.ai;
    this.scrub = SE.el('div', 'rw-scrub', layer);
    this.rwLabel = SE.el('div', 'rw-label mono', this.scrub,
      `<svg viewBox="0 0 24 12" aria-hidden="true"><path d="M11 0v12L2 6zM22 0v12L13 6z" fill="currentColor"/></svg><span>REWIND</span>`);
    this.rwTime = SE.el('div', 'rw-time mono', this.scrub, '00:06.00');
    const track = SE.el('div', 'rw-track', this.scrub);
    this.rwFill = SE.el('div', 'rw-fill', track);
    this.rwHead = SE.el('div', 'rw-head', track);
    this.ticks = SE.el('div', 'rw-ticks', track);
    for (let i = 0; i <= 12; i++) SE.el('i', '', this.ticks);

    this.freeze = SE.el('div', 'rw-freeze', layer, '<i></i><i></i><i></i><i></i>');

    this.head = SE.el('div', 'ai-head', layer);
    const title = SE.el('div', 'ai-title display', this.head);
    this.titleWords = SE.words(title, c.title, ['AI']);
    this.ans = SE.el('div', 'ai-ans mono', this.head, `<i class="dot"></i><span>${c.answering}</span><span class="dots"><i>.</i><i>.</i><i>.</i></span>`);
    this.ansDots = [...this.ans.querySelectorAll('.dots i')];
    this.ansDot = this.ans.querySelector('.dot');
  },
  update(ctx) {
    const E = SE.ease, p = SE.p, T = ctx.T;
    const R = ctx.cfg.rewind;
    const [a, b] = ctx.cfg.scenes.rewind;
    const t = T - a; // local, real time

    // ---- Rewind treatment (6.0 → 6.95) ----
    const rw = p(T, R.start, R.start + 0.15) * (1 - p(T, R.end, R.end + 0.12));
    const speed = T > R.start && T < R.end ? Math.sin(Math.PI * (T - R.start) / (R.end - R.start)) : 0;
    ctx.world_.blur += speed * 2.2;
    ctx.world_.s *= 1 - speed * 0.035;
    ctx.world_.sat *= 1 - speed * 0.35;
    const scrubVis = p(T, R.start, R.start + 0.2, E.outCubic) * (1 - p(T, R.freezeUntil, R.freezeUntil + 0.25));
    SE.set(this.scrub, { o: scrubVis, y: (1 - p(T, R.start, R.start + 0.3, E.outCubic)) * 30 });
    const frac = SE.clamp(ctx.S / R.from);
    SE.css(this.rwFill, { transform: `scaleX(${frac.toFixed(4)})` });
    SE.css(this.rwHead, { left: (frac * 100).toFixed(3) + '%' });
    SE.text(this.rwTime, SE.fmtTime(ctx.S));
    SE.set(this.rwLabel, { o: T < R.end ? 1 : 0.35 });

    // ---- Freeze (6.95 → 7.25): hold frame + viewfinder corners ----
    const fr = p(T, R.end - 0.02, R.end + 0.1, E.outExpo) * (1 - p(T, R.freezeUntil + 0.05, R.freezeUntil + 0.35, E.inOutCubic));
    SE.set(this.freeze, { o: fr, s: SE.lerp(1.06, 1, p(T, R.end, R.end + 0.2, E.outExpo)) });
    // punch-in on the freeze
    ctx.world_.s *= 1 + p(T, R.end, R.end + 0.12, E.outExpo) * 0.02 * (1 - p(T, R.freezeUntil, R.freezeUntil + 0.6, E.inOutCubic));

    if (T < R.end) { SE.set(this.head, { o: 0 }); return; }

    // ---- AI answers (7.25 → 9.4) ----
    const u = T - R.freezeUntil; // 0 at un-freeze
    const ph = ctx.phone.s;
    const settle = p(u, 0, 0.8, E.inOutCubic);
    ph.o = 1;
    ph.ry = SE.lerp(-5, 0, settle);
    ph.rx = SE.lerp(3, 0, settle);
    ph.rz = 0;
    ph.s = SE.lerp(0.8, 0.84, settle);
    ph.y = SE.lerp(1060, 1100, settle);
    ph.dim = 0; ph.missed = 0; ph.blur = 0;
    const ringing = u >= 0 && u < 0.62;
    ph.ring = u < 0.62 ? 1 : 0;
    ph.buzz = ringing ? 1 : 0;
    ph.ai = p(u, 0.12, 0.5, E.outExpo);
    ph.answer = p(u, 0.3, 0.6, E.inOutCubic);
    ph.connected = p(u, 0.62, 0.9, E.outCubic);
    ph.callSecs = 1 + Math.max(0, u - 0.62);
    ph.chat1 = p(u, 0.72, 1.15);
    ph.typing = p(u, 1.17, 1.22);
    ph.chat2 = p(u, 1.34, 1.78);
    const guestTalk = u > 0.72 && u < 1.15 ? 1 : 0;
    const aiTalk = u > 1.34 && u < 1.78 ? 1 : 0;
    ph.speak = Math.max(guestTalk * 0.55, aiTalk);

    // Exit toward the dashboard is handled by Scene 4 (it overrides phone).

    // Stage headline — mirrors the phone so it reads silently.
    const headIn = u >= 0 ? 1 : 0;
    SE.revealWords(this.titleWords, u, 0.16, 0.06, 0.6);
    const ansK = p(u, 0.3, 0.65, E.outCubic);
    const connected = p(u, 0.62, 0.8);
    const headOut = p(T, b - 0.5, b - 0.1, E.inOutCubic);
    SE.set(this.head, { o: headIn * (1 - headOut), y: -headOut * 40, blur: headOut * 6 });
    SE.set(this.ans, { o: ansK, y: (1 - ansK) * 16 });
    this.ansDots.forEach((d, i) => SE.css(d, { opacity: connected > 0 ? '1' : (0.25 + 0.75 * (Math.sin(T * 8 - i * 0.9) > 0 ? 1 : 0)).toFixed(2) }));
    SE.css(this.ans, { '--live': connected.toFixed(3) });
    SE.css(this.ansDot, { opacity: (0.55 + 0.45 * Math.sin(T * 7)).toFixed(2) });

    ctx.bg.s.y = 1150;
    ctx.bg.s.o = 0.2 + 0.45 * settle;
    ctx.bg.s.alert = 0;
  },
});

/* ---- scenes/04-automation.js ---- */
/*  SCENE 4 — THE AUTOMATION (9.0–15.2s)
    The phone recedes; the SmartEdge agent dashboard runs the booking
    pipeline one step at a time. */
SE.scene({
  id: 'automation',
  build(layer, ctx) {
    const c = ctx.cfg.copy.dashboard;
    this.c = c;
    this.orb1 = SE.el('div', 'glass-orb o1', layer);
    this.orb2 = SE.el('div', 'glass-orb o2', layer);
    const panel = (this.panel = SE.el('div', 'dash', layer));
    const head = SE.el('div', 'dash-head', panel);
    const brand = SE.el('div', 'dash-brand', head);
    const m = SE.el('img', 'dash-mark', brand); m.src = ctx.cfg.assets.mark;
    SE.el('div', 'dash-names', brand, `<div class="dash-prod display">${c.product}</div><div class="dash-agent">${c.agent}</div>`);
    this.live = SE.el('div', 'dash-live mono', head, `<i class="dot"></i>${c.live}`);
    this.liveDot = this.live.querySelector('.dot');

    const sub = SE.el('div', 'dash-sub mono', panel);
    SE.el('span', '', sub, c.session);
    this.clock = SE.el('span', 'dash-clock', sub, '00:00.0');

    const list = (this.list = SE.el('div', 'steps', panel));
    this.rail = SE.el('div', 'rail', list, '<b></b>');
    this.railFill = this.rail.firstChild;
    this.packet = SE.el('div', 'packet', list);
    this.steps = c.steps.map((s, i) => {
      const row = SE.el('div', 'step', list);
      const node = SE.el('div', 'node', row);
      const num = SE.el('span', 'node-n mono', node, String(i + 1).padStart(2, '0'));
      const spin = SE.el('span', 'node-spin', node);
      const chk = SE.el('span', 'node-chk', node, SE.checkSvg());
      const body = SE.el('div', 'step-body', row);
      SE.el('div', 'step-title display', body, s.title);
      const meta = SE.el('div', 'step-meta mono', body);
      SE.el('div', 'step-meta-ghost mono', body, s.meta);
      const tag = SE.el('div', 'step-tag mono', row, `<span class="run">RUNNING</span><span class="ok">DONE</span>`);
      return { row, node, num, spin, chk, chkPath: chk.querySelector('path'), meta, text: s.meta, tag,
        run: tag.querySelector('.run'), ok: tag.querySelector('.ok') };
    });

    const kpis = SE.el('div', 'kpis', panel);
    const ka = SE.el('div', 'kpi', kpis, `<div class="kpi-l mono">${c.kpiA.label}</div><div class="kpi-v display">${c.kpiA.value}</div>`);
    const kb = SE.el('div', 'kpi hero', kpis, `<div class="kpi-l mono">${c.kpiB.label}</div><div class="kpi-v display">€<span>0</span></div>`);
    this.kpiA = ka; this.kpiB = kb;
    this.kpiBVal = kb.querySelector('.kpi-v span');
  },
  update(ctx) {
    const E = SE.ease, p = SE.p, T = ctx.T;
    const [a, b] = ctx.cfg.scenes.automation;
    const t = T - a;
    if (T > a + 1) ctx.phone.s.o = 0; // phone has left for good
    if (t < -0.1 || T > b + 0.1) { SE.set(this.layer, { o: 0 }); return; }
    SE.set(this.layer, { o: 1 });

    // Phone recedes into depth as the panel rises.
    const ph = ctx.phone.s;
    const out = p(t, 0.0, 0.6, E.inOutCubic);
    if (t > -0.1) {
      ph.s *= 1 - out * 0.35;
      ph.y -= out * 160;
      ph.o *= 1 - p(t, 0.05, 0.4, E.inOutCubic);
      ph.blur += out * 12;
      ph.dim = Math.max(ph.dim, out * 0.6);
    }

    const rise = p(t, 0.1, 0.9, E.outExpo);
    const exit = p(T, b - 0.55, b - 0.05, E.inOutCubic);
    SE.set(this.panel, {
      o: p(t, 0.1, 0.45) * (1 - exit),
      y: (1 - rise) * 220 - p(t, 0.5, 6.0, E.inOutCubic) * 24 - exit * 40,
      rx: SE.lerp(18, 0, p(t, 0.1, 1.5, E.outCubic)),
      s: SE.lerp(0.94, 1, rise) * (1 - exit * 0.06),
      blur: (1 - rise) * 10 + exit * 10,
    });

    // Slow-drifting light behind the glass.
    const orbO = p(t, 0.1, 0.9) * (1 - exit);
    SE.set(this.orb1, { x: 560 + Math.sin(t * 0.7) * 140, y: 520 + Math.cos(t * 0.5) * 160 + (1 - rise) * 200, o: orbO * 0.9 });
    SE.set(this.orb2, { x: 40 + Math.cos(t * 0.6) * 120, y: 980 + Math.sin(t * 0.45) * 180 + (1 - rise) * 200, o: orbO * 0.8 });
    SE.css(this.liveDot, { opacity: (0.5 + 0.5 * Math.sin(T * 6)).toFixed(2) });
    SE.text(this.clock, SE.fmtTime(Math.max(0, t - 0.5)).slice(0, 7));

    // Steps: each one runs (spinner, packet travels in) then resolves.
    const S0 = 0.8, STEP = 0.95, RUN = 0.55;
    const n = this.steps.length;
    let railK = 0;
    this.steps.forEach((s, i) => {
      const st = S0 + i * STEP;
      const reveal = p(t, 0.45 + i * 0.07, 0.95 + i * 0.07, E.outExpo);
      const active = p(t, st, st + 0.18, E.outCubic);
      const done = p(t, st + RUN, st + RUN + 0.3, E.outExpo);
      const running = active * (1 - done);
      SE.set(s.row, { o: reveal * (0.34 + 0.66 * Math.max(active, done)), y: (1 - reveal) * 30 });
      SE.css(s.row, { '--act': running.toFixed(3), '--done': done.toFixed(3) });
      SE.set(s.num, { o: 1 - done, s: 1 - done * 0.5 });
      SE.set(s.spin, { o: running, rz: (t - st) * 420 });
      SE.set(s.chk, { o: done > 0 ? 1 : 0, s: 0.6 + 0.4 * E.outBack(done) });
      SE.css(s.chkPath, { strokeDasharray: '1', strokeDashoffset: (1 - p(t, st + RUN, st + RUN + 0.35, E.outCubic)).toFixed(3) });
      SE.text(s.meta, SE.typed(s.text, p(t, st + 0.1, st + RUN + 0.2)));
      SE.set(s.tag, { o: Math.max(active, done), s: 0.9 + 0.1 * Math.max(active, done) });
      SE.set(s.run, { o: running });
      SE.set(s.ok, { o: done });
      if (t >= st) railK = i + p(t, st, st + RUN, E.inOutCubic);
    });
    // Rail runs node-centre to node-centre; packet rides its tip.
    const railFrac = SE.clamp(railK / (n - 1));
    SE.css(this.railFill, { transform: `scaleY(${railFrac.toFixed(4)})` });
    const lastDone = t > S0 + (n - 1) * STEP + RUN;
    const moving = t > S0 && !lastDone;
    SE.css(this.packet, { top: `calc(var(--rail-top) + ${railFrac.toFixed(4)} * var(--rail-h))` });
    SE.set(this.packet, { o: moving ? 1 : 0, s: 1 + 0.15 * Math.sin(T * 10) });

    // KPIs
    const ka = p(t, S0 + RUN, S0 + RUN + 0.4, E.outCubic);
    SE.set(this.kpiA, { o: 0.35 + 0.65 * ka });
    const bookDone = S0 + 3 * STEP + RUN;
    const kb = p(t, bookDone, bookDone + 0.7, E.outCubic);
    SE.text(this.kpiBVal, String(Math.round(this.c.kpiB.value * kb)));
    SE.set(this.kpiB, { o: 0.35 + 0.65 * p(t, bookDone, bookDone + 0.2) });
    SE.css(this.kpiB, { '--glow': (kb * (1 - p(t, bookDone + 0.8, bookDone + 2))).toFixed(3) });

    ctx.bg.s.y = SE.lerp(1150, 900, rise);
    ctx.bg.s.o = SE.lerp(ctx.bg.s.o, 0.42, rise);
    ctx.bg.s.o2 = rise * 0.25 * (1 - exit);
    ctx.bg.s.y2 = 1650;
  },
});

/* ---- scenes/05-result.js ---- */
/*  SCENE 5 — THE RESULT (14.9–19.0s)
    Booking confirmation, then the SmartEdge mark and end line. */
SE.scene({
  id: 'result',
  build(layer, ctx) {
    const c = ctx.cfg.copy.result;
    this.c = c;
    // Confirmation card
    this.orb1 = SE.el('div', 'glass-orb o1', layer);
    this.orb2 = SE.el('div', 'glass-orb o2', layer);
    const card = (this.card = SE.el('div', 'confirm', layer));
    const top = SE.el('div', 'confirm-top', card);
    this.badge = SE.el('div', 'confirm-badge', top, SE.checkSvg());
    this.badgePath = this.badge.querySelector('path');
    this.badgeRing = SE.el('div', 'confirm-ring', this.badge);
    this.title = SE.el('div', 'confirm-title display', top, c.title);
    const rows = SE.el('div', 'confirm-rows', card);
    this.rows = c.rows.map(([k, v]) =>
      SE.el('div', 'crow' + (k === 'TOTAL' ? ' total' : ''), rows, `<span class="mono">${k}</span><span>${v}</span>`));
    this.foot = SE.el('div', 'confirm-foot mono', card, `<i class="dot"></i>${c.footnote}`);

    // End card
    const end = (this.end = SE.el('div', 'endcard', layer));
    this.glow = SE.el('div', 'end-glow', end);
    this.particles = SE.el('div', 'particles', end);
    const r = SE.rng(42);
    this.dots = Array.from({ length: 34 }, () => {
      const d = SE.el('i', '', this.particles);
      const size = 2 + r() * 3.5;
      SE.css(d, { width: size + 'px', height: size + 'px' });
      return { d, ang: r() * Math.PI * 2, rad: 170 + r() * 360, spd: 0.04 + r() * 0.1, rise: 14 + r() * 40, ph: r() * 6.28, a: 0.15 + r() * 0.35 };
    });
    this.mark = SE.el('img', 'end-mark', end);
    this.mark.src = ctx.cfg.assets.mark;
    const hl = SE.el('div', 'end-head display', end);
    this.hlWords = c.headline.map((line) => SE.words(SE.el('div', 'line', hl), line, [])).flat();
    this.cta = SE.el('div', 'end-cta display', end, `<span>${c.cta}</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
    this.ctaSheen = SE.el('i', 'cta-sheen', this.cta);
    this.url = SE.el('div', 'end-url mono', end, c.url);
    this.tag = SE.el('div', 'end-tag mono', end, c.tagline);
  },
  update(ctx) {
    const E = SE.ease, p = SE.p, T = ctx.T;
    const [a] = ctx.cfg.scenes.result;
    const t = T - a;
    if (t < -0.05) { SE.set(this.layer, { o: 0 }); return; }
    SE.set(this.layer, { o: 1 });

    // ---- Confirmation card (0.2 → 1.9) ----
    const cin = p(t, 0.2, 0.95, E.outExpo);
    const cout = p(t, 1.7, 2.05, E.inOutCubic);
    SE.set(this.card, { o: p(t, 0.2, 0.5) * (1 - cout), s: SE.lerp(0.92, 1, cin) * (1 - cout * 0.12), y: (1 - cin) * 60 - cout * 20, blur: (1 - cin) * 10 + cout * 12 });
    const orbO = p(t, 0, 0.6) * (1 - cout);
    SE.set(this.orb1, { x: 520 + Math.sin(t * 0.8) * 120, y: 420 + Math.cos(t * 0.6) * 100, o: orbO * 0.85 });
    SE.set(this.orb2, { x: 120 + Math.cos(t * 0.7) * 100, y: 1000 + Math.sin(t * 0.5) * 120, o: orbO * 0.8 });
    SE.css(this.badgePath, { strokeDasharray: '1', strokeDashoffset: (1 - p(t, 0.45, 0.85, E.outCubic)).toFixed(3) });
    const pulse = p(t, 0.75, 1.5, E.outCubic);
    SE.set(this.badgeRing, { s: 1 + pulse * 0.7, o: (1 - pulse) * (pulse > 0 ? 0.8 : 0) });
    SE.set(this.badge, { s: 0.6 + 0.4 * E.outBack(p(t, 0.3, 0.75)) });
    SE.set(this.title, { o: p(t, 0.45, 0.8), y: (1 - p(t, 0.45, 0.9, E.outExpo)) * 20 });
    this.rows.forEach((r, i) => {
      const k = p(t, 0.6 + i * 0.07, 1.05 + i * 0.07, E.outExpo);
      SE.set(r, { o: k, y: (1 - k) * 18 });
    });
    SE.set(this.foot, { o: p(t, 1.0, 1.3) });

    // ---- End card (1.9 → 4.1) ----
    const m = p(t, 1.98, 3.0, E.outExpo);
    const idle = Math.max(0, t - 1.98);
    SE.set(this.mark, { o: p(t, 1.98, 2.4), s: SE.lerp(0.55, 1, m) + idle * 0.012, rz: SE.lerp(-28, 0, m) + idle * 1.5, blur: (1 - m) * 18 });
    SE.set(this.glow, { o: p(t, 1.9, 2.8) * (0.75 + 0.1 * Math.sin(T * 1.8)), s: SE.lerp(0.6, 1, m) });
    SE.revealWords(this.hlWords, t, 2.25, 0.07, 0.7);
    // CTA button lands, then a single light sweep across it.
    const w = p(t, 2.75, 3.3, E.outExpo);
    SE.set(this.cta, { o: w, y: (1 - w) * 24, s: SE.lerp(0.92, 1, w) });
    SE.css(this.ctaSheen, { transform: `translateX(${SE.lerp(-140, 620, p(t, 3.2, 3.9, E.inOutCubic)).toFixed(1)}px) skewX(-20deg)` });
    const u = p(t, 2.95, 3.4, E.outCubic);
    SE.set(this.url, { o: u, y: (1 - u) * 14 });
    const tg = p(t, 3.1, 3.55, E.outCubic);
    SE.set(this.tag, { o: tg, y: (1 - tg) * 12 });
    SE.css(this.tag, { letterSpacing: SE.lerp(0.36, 0.22, tg).toFixed(3) + 'em' });

    const pv = p(t, 2.2, 3.2);
    this.dots.forEach((q) => {
      const ang = q.ang + idle * q.spd;
      const x = Math.cos(ang) * q.rad;
      const y = Math.sin(ang) * q.rad * 0.8 - idle * q.rise;
      SE.set(q.d, { x, y, o: pv * q.a * (0.6 + 0.4 * Math.sin(T * 2 + q.ph)) });
    });

    ctx.bg.s.y = SE.lerp(ctx.bg.s.y, 700, p(t, 1.8, 2.6, E.inOutCubic));
    ctx.bg.s.o = SE.lerp(0.4, 0.6, p(t, 1.9, 3));
    ctx.bg.s.o2 = 0;
    ctx.world_.s *= 1 + p(t, 1.85, 4.2, E.outCubic) * 0.025;
  },
});

/* ---- player.js ---- */
/*  Preview player. In render mode (?render or #render) it only exposes
    SE.render(T) and window.__reelReady for the frame capturer. */
(async function () {
  const cfg = SE.config;
  const render = /render/.test(location.search + location.hash);
  if (render) document.body.classList.add('render');
  const stage = document.getElementById('stage');
  const vp = document.getElementById('viewport');
  const frames = Math.round(cfg.duration * cfg.fps);

  await SE.init(stage);
  window.__reelReady = true;
  if (render) {
    vp.style.width = cfg.width + 'px';
    vp.style.height = cfg.height + 'px';
    return;
  }

  const playBtn = document.getElementById('play');
  const scrub = document.getElementById('scrub');
  const tc = document.getElementById('tc');
  const chips = document.getElementById('chips');
  scrub.max = String(frames - 1);

  function fit() {
    const availH = window.innerHeight - 150;
    const availW = Math.min(window.innerWidth - 32, 620);
    const s = Math.max(0.12, Math.min(availH / cfg.height, availW / cfg.width));
    vp.style.width = cfg.width * s + 'px';
    vp.style.height = cfg.height * s + 'px';
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fit);
  fit();

  const names = { hook: 'Hook', lost: 'Lost booking', rewind: 'Rewind', automation: 'Automation', result: 'Result' };
  const chipEls = Object.entries(cfg.scenes).map(([id, [a, b]]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = `${names[id] || id} ${a.toFixed(1)}s`;
    btn.addEventListener('click', () => { seek(a); });
    chips.appendChild(btn);
    return { btn, a, b };
  });

  let T = 0, playing = false, last = 0;
  function show(t) {
    T = Math.max(0, Math.min(cfg.duration - 1 / cfg.fps, t));
    SE.render(T);
    const f = Math.round(T * cfg.fps);
    scrub.value = String(f);
    tc.textContent = `${SE.fmtTime(T)} · F${String(f).padStart(3, '0')}`;
    chipEls.forEach((c) => c.btn.classList.toggle('on', T >= c.a && T < c.b));
  }
  function seek(t) { show(t); }
  function loop(now) {
    if (!playing) return;
    const dt = (now - last) / 1000;
    last = now;
    let t = T + dt;
    if (t >= cfg.duration) t = 0;
    show(t);
    requestAnimationFrame(loop);
  }
  function setPlaying(v) {
    playing = v;
    playBtn.textContent = v ? 'Pause' : 'Play';
    if (v) { last = performance.now(); requestAnimationFrame(loop); }
  }
  playBtn.addEventListener('click', () => setPlaying(!playing));
  scrub.addEventListener('input', () => { setPlaying(false); show(+scrub.value / cfg.fps); });
  window.addEventListener('keydown', (e) => {
    if (e.target === scrub && e.key.startsWith('Arrow')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    if (e.key === 'ArrowRight') { setPlaying(false); show(T + (e.shiftKey ? 1 : 1 / cfg.fps)); }
    if (e.key === 'ArrowLeft') { setPlaying(false); show(T - (e.shiftKey ? 1 : 1 / cfg.fps)); }
  });

  show(0);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) setPlaying(true);
})();
</script>
