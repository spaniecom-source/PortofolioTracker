<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartEdge Missed Call Reel</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root { color-scheme: dark; --p-bg: #0d0a08; --p-ink: #F5F1ED; --p-dim: #9a8f84; --p-line: #2a241d; --p-acc: #FF5A36; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--p-bg); color: var(--p-ink); font: 14px/1.4 'Manrope', system-ui, sans-serif; }
  .player { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 16px; padding-inline: 16px; box-sizing: border-box; }
  .viewport { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px var(--p-line); flex: none; }
  .viewport .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .controls { width: 100%; max-width: 560px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .controls button { font: 600 13px/1 'Manrope', sans-serif; color: var(--p-ink); background: #1F1B15; border: 1px solid var(--p-line); border-radius: 99px; padding: 10px 16px; cursor: pointer; min-width: 74px; }
  .controls button:focus-visible, #scrub:focus-visible, .chips button:focus-visible { outline: 2px solid var(--p-acc); outline-offset: 2px; }
  #scrub { width: 100%; accent-color: var(--p-acc); }
  .tc { font: 500 12px/1 'JetBrains Mono', monospace; color: var(--p-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chips { width: 100%; max-width: 560px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font: 500 11px/1 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--p-dim); background: transparent; border: 1px solid var(--p-line); border-radius: 99px; padding: 7px 10px; cursor: pointer; }
  .chips button.on { color: var(--p-ink); border-color: var(--p-acc); }
  .hint { max-width: 560px; width: 100%; color: var(--p-dim); font-size: 12px; }
  /* Render mode: bare 1080×1920 stage for frame capture */
  body.render .controls, body.render .chips, body.render .hint { display: none; }
  body.render .player { padding: 0; }
  body.render .viewport { border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<main class="player">
  <div class="viewport" id="viewport"><div class="stage" id="stage"></div></div>
  <div class="controls">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="569" step="1" value="0" aria-label="Timeline">
    <span class="tc" id="tc">00:00.00 · F000</span>
  </div>
  <div class="chips" id="chips"></div>
  <p class="hint">Space plays or pauses. Arrow keys step one frame (Shift for one second). Silent by design, with an SFX cue sheet in <code>audio-cues.json</code>.</p>
</main>

<script src="config.js"></script>
<script src="engine/core.js"></script>
<script src="engine/components.js"></script>
<script src="scenes/01-hook.js"></script>
<script src="scenes/02-lost.js"></script>
<script src="scenes/03-rewind.js"></script>
<script src="scenes/04-automation.js"></script>
<script src="scenes/05-result.js"></script>
<script src="player.js"></script>
</body>
</html>
